      tags: [Backup]
      summary: (Admin) Déclenche un backup DB manuel (pg_dump)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Backup créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  filename: { type: string }
                  path: { type: string }
                  size_bytes: { type: integer }
                  duration_ms: { type: integer }
                  deleted: { type: integer, description: "Anciens backups supprimés (rotation)" }
        "500": { description: pg_dump introuvable ou a échoué }

  /admin/backup/list:
    get:
      tags: [Backup]
      summary: (Admin) Liste les backups existants
      security: [{ bearerAuth: [] }]
