  # ============================================================
  # SHOPS
  # ============================================================
  /shops/nearby:
    get:
      tags: [Shops]
      summary: Liste les boutiques proches (Haversine)
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { in: query, name: lng, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { in: query, name: radius, schema: { type: number, default: 25, maximum: 500, description: "en km" } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Liste triée par distance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  radius_km: { type: number }
                  center: { type: object }
                  shops: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /shops:
    get:
      tags: [Shops]
      summary: Liste toutes les boutiques (non masquées)
      responses:
        "200": { description: Liste }
    post:
      tags: [Shops]
      summary: Crée une boutique (pro only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2 }
                description: { type: string }
                logo_url: { type: string, format: uri }
                banner_url: { type: string, format: uri }
                address: { type: string }
                city: { type: string }
                postal_code: { type: string }
                phone: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
