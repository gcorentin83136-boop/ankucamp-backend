      responses:
        "201": { description: Commentaire créé }
    get:
      tags: [Posts]
      summary: Liste les commentaires (structurés racine + réponses)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /posts/{id}/comments/{commentId}:
    delete:
      tags: [Posts]
      summary: Supprime un commentaire (auteur ou auteur du post)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: commentId, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }
        "403": { $ref: "#/components/responses/Forbidden" }

  /posts/{id}/share:
    post:
