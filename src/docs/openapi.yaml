  # ============================================================
  # SETTINGS — ACCOUNT
  # ============================================================
  /settings/account/email:
    put:
      tags: [Settings]
      summary: Change mon email
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Email modifié }

  /settings/account/password:
    put:
      tags: [Settings]
      summary: Change mon mot de passe (révoque les autres sessions)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Mot de passe modifié }

  /settings/account/username:
    put:
      tags: [Settings]
      summary: Change mon username
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
      responses:
        "200": { description: Username modifié }

  /settings/account/info:
    put:
      tags: [Settings]
      summary: Met à jour mes infos personnelles
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                birth_year: { type: integer }
                address: { type: string }
                city: { type: string }
                postal_code: { type: string }
      responses:
        "200": { description: Infos modifiées }

  /settings/account/deactivate:
    delete:
      tags: [Settings]
      summary: Désactive mon compte
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { description: Compte désactivé }

  # ============================================================
  # SETTINGS — NOTIFICATIONS
  # ============================================================
  /settings/notifications:
    get:
      tags: [Settings]
      summary: Récupère mes préférences notifications (lazy create)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Préférences }
    put:
      tags: [Settings]
      summary: Met à jour toutes mes préférences notifications
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_order_updates: { type: boolean }
                email_new_messages: { type: boolean }
                email_social_activity: { type: boolean }
                email_marketing: { type: boolean }
                push_order_updates: { type: boolean }
                push_new_messages: { type: boolean }
                push_social_activity: { type: boolean }
      responses:
        "200": { description: Préférences mises à jour }

  /settings/notifications/email:
    put:
      tags: [Settings]
      summary: Met à jour uniquement les préférences email
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Préférences email mises à jour }

  /settings/notifications/push:
    put:
      tags: [Settings]
      summary: Met à jour uniquement les préférences push
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Préférences push mises à jour }

  # ============================================================
  # SETTINGS — PRIVACY
  # ============================================================
  /settings/privacy:
    get:
      tags: [Settings]
      summary: Récupère mes paramètres de confidentialité
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paramètres }
    put:
      tags: [Settings]
      summary: Met à jour tous mes paramètres de confidentialité
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Mise à jour }

  /settings/privacy/visibility:
    put:
      tags: [Settings]
      summary: Change la visibilité du profil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_visibility]
              properties:
                profile_visibility:
                  type: string
                  enum: [public, friends, private]
      responses:
        "200": { description: Visibilité modifiée }

  /settings/privacy/messages:
    put:
      tags: [Settings]
      summary: Change qui peut m'envoyer des messages
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_messages_from]
              properties:
                allow_messages_from:
                  type: string
                  enum: [everyone, friends, nobody]
      responses:
        "200": { description: Paramètre modifié }

  # ============================================================
  # SETTINGS — SHOP
  # ============================================================
  /settings/shop/{shopId}:
    get:
      tags: [Settings]
      summary: Récupère les paramètres d'une boutique (lazy create)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      responses:
        "200": { description: Paramètres }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Settings]
      summary: Met à jour les paramètres d'une boutique
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      responses:
        "200": { description: Mise à jour }

  /settings/shop/{shopId}/vacation:
    put:
      tags: [Settings]
      summary: Active/désactive le mode vacances
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vacation_mode: { type: boolean }
                vacation_message: { type: string }
                vacation_until: { type: string, format: date-time, nullable: true }
      responses:
        "200": { description: Mode vacances mis à jour }

  /settings/shop/{shopId}/hidden:
    put:
      tags: [Settings]
      summary: Masque/démasque la boutique
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_hidden]
              properties:
                is_hidden: { type: boolean }
      responses:
        "200": { description: Statut modifié }

  /settings/shop/{shopId}/returns:
    put:
      tags: [Settings]
      summary: Active/désactive les retours
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accepts_returns: { type: boolean }
                return_days: { type: integer, default: 14 }
      responses:
        "200": { description: Retours configurés }

  /settings/shop/{shopId}/contact:
    put:
      tags: [Settings]
      summary: Met à jour contact (phone + email)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: shopId, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_phone: { type: string }
                contact_email: { type: string, format: email, nullable: true }
      responses:
        "200": { description: Contact mis à jour }

  # ============================================================
  # SETTINGS — SESSIONS
  # ============================================================
  /settings/sessions:
    get:
      tags: [Settings]
      summary: Liste mes sessions actives
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  sessions:
                    type: array
                    items: { type: object }

  /settings/sessions/{id}:
    delete:
      tags: [Settings]
      summary: Révoque une session (pas la courante)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Session révoquée }
        "400": { description: "Impossible de révoquer la session courante" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings/sessions/all:
    delete:
      tags: [Settings]
      summary: Révoque TOUTES les autres sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sessions révoquées
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer, description: "Nombre de sessions révoquées" }

  # ============================================================
  # SETTINGS — GDPR
  # ============================================================
  /settings/gdpr/export:
    post:
      tags: [Settings]
      summary: Demande un export RGPD de mes données
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: "Demande créée (traitement async)" }
        "409": { description: "Un export est déjà en cours" }

  /settings/gdpr/delete:
    post:
      tags: [Settings]
      summary: Programme la suppression de mon compte (30 jours)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "201": { description: Suppression programmée }
    delete:
      tags: [Settings]
      summary: Annule ma demande de suppression
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Suppression annulée }

  /settings/gdpr/acceptance:
    post:
      tags: [Settings]
      summary: Enregistre une acceptation CGU / privacy / cookies
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, document_version]
              properties:
                document_type:
                  type: string
                  enum: [cgu, privacy, cookies]
                document_version: { type: string }
      responses:
        "201": { description: Acceptation enregistrée }


  # ============================================================
  # ORDERS
  # ============================================================
  /orders/me:
    get:
      tags: [Orders]
      summary: Liste mes commandes (acheteur)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orders:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/seller/me:
    get:
      tags: [Orders]
      summary: Liste les commandes reçues (vendeur)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orders:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders:
    post:
      tags: [Orders]
      summary: Crée une commande
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seller_id, delivery_method, items]
              properties:
                seller_id: { type: integer }
                delivery_method:
                  type: string
                  enum: [pickup, delivery, shipping]
                delivery_address: { type: string, nullable: true }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: Commande créée }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /orders/{id}/invoice:
    get:
      tags: [Orders]
      summary: Redirige vers la facture PDF Cloudinary
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "302": { description: Redirect vers la facture }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{id}/invoice/resend:
    post:
      tags: [Orders]
      summary: Renvoie la facture par email
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Facture renvoyée }
        "400": { description: Commande non payée }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Détail d'une commande (buyer ou seller)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Orders]
      summary: Supprime une commande pending (buyer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimée }
        "400": { description: Commande non annulable }

  /orders/{id}/status:
    put:
      tags: [Orders]
      summary: Change le statut (buyer annule, seller confirme/expédie/livre)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, shipped, delivered, cancelled]
                tracking_number: { type: string, nullable: true }
      responses:
        "200": { description: Statut mis à jour }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # PAYMENTS (Stripe)
  # ============================================================
  /payments/webhook:
    post:
      tags: [Payments]
      summary: Webhook Stripe (raw body, PAS d'auth)
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Événement traité
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
        "400": { description: Signature invalide }

  /payments/checkout:
    post:
      tags: [Payments]
      summary: Crée une session Stripe Checkout pour une commande
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer }
      responses:
        "201":
          description: Session créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  url: { type: string, format: uri }
                  session_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /payments/me:
    get:
      tags: [Payments]
      summary: Liste mes paiements
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  payments:
                    type: array
                    items: { type: object }

  /payments/order/{orderId}:
    get:
      tags: [Payments]
      summary: Récupère le paiement d'une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: integer } }
      responses:
        "200": { description: Paiement }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payments/connect/onboard:
    post:
      tags: [Payments]
      summary: Génère un lien d'onboarding Stripe Connect (pro only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lien d'onboarding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  onboarding_url: { type: string, format: uri }
        "403": { description: Seuls les pros peuvent se connecter à Stripe }

  /payments/connect/status:
    get:
      tags: [Payments]
      summary: Statut Stripe Connect du pro
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Statut
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status:
                    type: string
                    enum: [not_connected, pending, pending_verification, active]
                  charges_enabled: { type: boolean }
                  payouts_enabled: { type: boolean }
                  account_id: { type: string }

  # ============================================================
  # REFUNDS
  # ============================================================
  /refunds/request:
    post:
      tags: [Refunds]
      summary: Demande un remboursement (buyer)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, reason]
              properties:
                order_id: { type: integer }
                reason: { type: string }
      responses:
        "201": { description: Demande créée }
        "400": { $ref: "#/components/responses/BadRequest" }

  /refunds/me:
    get:
      tags: [Refunds]
      summary: Liste mes demandes de remboursement (buyer)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  refunds:
                    type: array
                    items: { type: object }

  /refunds:
    get:
      tags: [Refunds]
      summary: Liste tous les remboursements (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected, refunded, failed] } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refunds/{id}/approve:
    put:
      tags: [Refunds]
      summary: Approuve un remboursement (admin) — déclenche le remboursement Stripe
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_comment: { type: string, nullable: true }
      responses:
        "200": { description: Remboursement approuvé et effectué }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refunds/{id}/reject:
    put:
      tags: [Refunds]
      summary: Rejette un remboursement (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_comment: { type: string, nullable: true }
      responses:
        "200": { description: Remboursement rejeté }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refunds/{id}:
    get:
      tags: [Refunds]
      summary: Détail d'un remboursement (buyer ou admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # REVIEWS
  # ============================================================
  /reviews/product/{id}/stats:
    get:
      tags: [Reviews]
      summary: Stats d'un produit (moyenne + distribution 1-5 étoiles)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  average: { type: number, example: 4.5 }
                  total: { type: integer }
                  distribution:
                    type: object
                    properties:
                      "1": { type: integer }
                      "2": { type: integer }
                      "3": { type: integer }
                      "4": { type: integer }
                      "5": { type: integer }

  /reviews/product/{id}:
    get:
      tags: [Reviews]
      summary: Liste les avis d'un produit
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [recent, rating_desc, rating_asc], default: recent } }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  reviews:
                    type: array
                    items: { type: object }

  /reviews:
    post:
      tags: [Reviews]
      summary: Crée un avis (buyer, commande livrée)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, product_id, rating]
              properties:
                order_id: { type: integer }
                product_id: { type: integer }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, nullable: true }
      responses:
        "201": { description: Avis créé }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reviews/me:
    get:
      tags: [Reviews]
      summary: Liste mes avis (en tant qu'auteur)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Liste }

  /reviews/seller/me:
    get:
      tags: [Reviews]
      summary: Liste les avis reçus (en tant que vendeur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [recent, rating_desc, rating_asc], default: recent } }
      responses:
        "200": { description: Liste }

  /reviews/{id}/report:
    post:
      tags: [Reviews]
      summary: Signale un avis (vendeur uniquement)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200": { description: Avis signalé }
        "403": { description: Seul le vendeur concerné peut signaler }

  /reviews/{id}:
    delete:
      tags: [Reviews]
      summary: Supprime son avis (auteur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }
        "403": { $ref: "#/components/responses/Forbidden" }

        
  # ============================================================
  # POSTS (réseau social)
  # ============================================================
  /posts/feed:
    get:
      tags: [Posts]
      summary: Feed social (posts + événements d'amis)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  posts:
                    type: array
                    items: { type: object }
                  events_from_friends:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /posts/me:
    get:
      tags: [Posts]
      summary: Liste mes posts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /posts:
    post:
      tags: [Posts]
      summary: Crée un post
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 5000, nullable: true }
                media_urls:
                  type: array
                  maxItems: 4
                  items: { type: string, format: uri }
                visibility:
                  type: string
                  enum: [public, friends, private]
                  default: public
      responses:
        "201": { description: Post créé }
        "400": { $ref: "#/components/responses/BadRequest" }

  /posts/share-event/{eventId}:
    post:
      tags: [Posts]
      summary: Partage un événement dans le réseau social
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                share_comment: { type: string, maxLength: 2000, nullable: true }
                visibility:
                  type: string
                  enum: [public, friends, private]
                  default: public
      responses:
        "201": { description: Événement partagé }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts/events/{eventId}/like:
    post:
      tags: [Posts]
      summary: Toggle un like sur un événement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Toggle effectué
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  liked: { type: boolean }
                  likes_count: { type: integer }

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Détail d'un post (auth optionnelle)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Post }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Posts]
      summary: Modifie un post (auteur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, nullable: true }
                visibility:
                  type: string
                  enum: [public, friends, private]
      responses:
        "200": { description: Modifié }
    delete:
      tags: [Posts]
      summary: Supprime un post (auteur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }

  /posts/{id}/like:
    post:
      tags: [Posts]
      summary: Toggle un like sur un post
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Toggle effectué }

  /posts/{id}/likes:
    get:
      tags: [Posts]
      summary: Liste les likes d'un post
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /posts/{id}/comments:
    post:
      tags: [Posts]
      summary: Ajoute un commentaire
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
