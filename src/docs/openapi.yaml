        - { in: query, name: sort, schema: { type: string, enum: [relevance, recent, alphabetical], default: relevance } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: lat, schema: { type: number } }
        - { in: query, name: lng, schema: { type: number } }
        - { in: query, name: radius, schema: { type: number, default: 25 } }
      responses:
        "200": { description: Résultats }

  /search/shops:
    get:
      tags: [Search]
      summary: Recherche de boutiques
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, recent, rating, products_count], default: relevance } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: lat, schema: { type: number } }
        - { in: query, name: lng, schema: { type: number } }
        - { in: query, name: radius, schema: { type: number, default: 25 } }
      responses:
        "200": { description: Résultats }

  /search/products:
    get:
      tags: [Search]
      summary: Recherche de produits
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: shop_id, schema: { type: integer } }
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: min_price, schema: { type: number } }
        - { in: query, name: max_price, schema: { type: number } }
        - { in: query, name: in_stock, schema: { type: boolean } }
        - { in: query, name: min_rating, schema: { type: number, minimum: 1, maximum: 5 } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, recent, price_asc, price_desc, rating], default: relevance } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: lat, schema: { type: number } }
        - { in: query, name: lng, schema: { type: number } }
        - { in: query, name: radius, schema: { type: number, default: 25 } }
      responses:
        "200": { description: Résultats }

  /search/suggest:
    get:
      tags: [Search]
      summary: Autocomplete (min 2 car.)
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 50 } }
        - { in: query, name: limit, schema: { type: integer, default: 5, maximum: 10 } }
      responses:
        "200": { description: Suggestions }

  # ============================================================
  # GEO
  # ============================================================
  /geo/geocode:
    post:
      tags: [Geo]
      summary: Géocode une adresse (API adresse.data.gouv.fr)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, minLength: 5, maxLength: 255 }
      responses:
        "200":
          description: Coordonnées + label
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  latitude: { type: number }
                  longitude: { type: number }
                  label: { type: string }
                  city: { type: string }
                  postal_code: { type: string }
                  score: { type: number }
        "404": { description: Adresse introuvable }
        "502": { description: API gouvernementale injoignable }

  # ============================================================
  # EVENTS
  # ============================================================
  /events:
    get:
      tags: [Events]
      summary: Liste les événements publiés (auth optionnelle)
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [all, marche, atelier, salon, porte_ouverte, degustation, autre], default: all } }
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: upcoming, schema: { type: boolean, default: true } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Events]
      summary: Crée un événement (pro only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, start_at]
              properties:
                title: { type: string, minLength: 2, maxLength: 255 }
                description: { type: string, nullable: true }
                cover_url: { type: string, format: uri, nullable: true }
                type: { type: string, enum: [marche, atelier, salon, porte_ouverte, degustation, autre] }
                start_at: { type: string, format: date-time }
                end_at: { type: string, format: date-time, nullable: true }
                shop_id: { type: integer, nullable: true }
                address: { type: string, nullable: true }
                city: { type: string, nullable: true }
                postal_code: { type: string, nullable: true }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                capacity: { type: integer, nullable: true }
                is_free: { type: boolean, default: true }
                price: { type: number, nullable: true }
                status: { type: string, enum: [draft, published], default: published }
      responses:
        "201": { description: Événement créé }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/nearby:
    get:
      tags: [Events]
      summary: Événements proches (Haversine)
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number } }
        - { in: query, name: lng, required: true, schema: { type: number } }
        - { in: query, name: radius, schema: { type: number, default: 25, maximum: 500 } }
        - { in: query, name: upcoming, schema: { type: boolean, default: true } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste triée par distance }

  /events/me:
    get:
      tags: [Events]
      summary: Liste mes événements (organisateur)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Liste }

  /events/{id}:
    get:
      tags: [Events]
      summary: Détail d'un événement (auth optionnelle)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Events]
      summary: Modifie un événement (organisateur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Modifié }
    delete:
      tags: [Events]
      summary: Supprime un événement (organisateur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }

  /events/{id}/registrations:
    get:
      tags: [Events]
      summary: Liste les inscrits (organisateur uniquement)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Liste }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{id}/register:
    post:
      tags: [Events]
      summary: S'inscrire à un événement (waitlist si complet)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Inscription créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: string, enum: [registered, waitlist] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Events]
      summary: Se désinscrire d'un événement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Désinscription OK }

  /events/{id}/cancel:
    put:
      tags: [Events]
      summary: Annuler un événement (organisateur) + notif inscrits
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        "200": { description: Événement annulé }

  # ============================================================
  # ARTICLES (blog)
  # ============================================================
  /articles:
    get:
      tags: [Articles]
      summary: Liste les articles publiés
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category, schema: { type: string, enum: [all, recette, conseil, portrait, actualite, autre], default: all } }
        - { in: query, name: tag, schema: { type: string } }
        - { in: query, name: author_id, schema: { type: integer } }
        - { in: query, name: sort, schema: { type: string, enum: [recent, popular, views], default: recent } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Articles]
      summary: Crée un article
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, category]
              properties:
                title: { type: string, minLength: 3 }
                excerpt: { type: string, maxLength: 500, nullable: true }
                content: { type: string, minLength: 20 }
                cover_url: { type: string, format: uri, nullable: true }
                tags:
                  type: array
                  maxItems: 10
                  items: { type: string }
                category: { type: string, enum: [recette, conseil, portrait, actualite, autre] }
                status: { type: string, enum: [draft, published], default: published }
      responses:
        "201": { description: Article créé }

  /articles/me:
    get:
      tags: [Articles]
      summary: Liste mes articles (inclut drafts)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Liste }

  /articles/{slug}:
    get:
      tags: [Articles]
      summary: Détail par slug (+ incrémente views)
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200": { description: Article }
        "404": { $ref: "#/components/responses/NotFound" }

  /articles/{id}:
    put:
      tags: [Articles]
      summary: Modifie un article (auteur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Modifié }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Articles]
      summary: Supprime un article (auteur)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }

  /articles/{id}/like:
    post:
      tags: [Articles]
      summary: Toggle like sur un article
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Toggle effectué }

  # ============================================================
  # CART (panier)
  # ============================================================
  /cart:
    get:
      tags: [Cart]
      summary: Mon panier (groupé par vendeur)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Panier
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  items: { type: array, items: { type: object } }
                  items_count: { type: integer }
                  subtotal: { type: number }
                  by_seller: { type: array, items: { type: object } }
    delete:
      tags: [Cart]
      summary: Vide tout le panier
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Vidé }

  /cart/items:
    post:
      tags: [Cart]
      summary: Ajoute un produit au panier (cumul si déjà présent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer }
                quantity: { type: integer, default: 1, minimum: 1, maximum: 99 }
      responses:
        "201": { description: Ajouté }
        "400": { description: Stock insuffisant }
        "404": { $ref: "#/components/responses/NotFound" }

  /cart/items/{productId}:
    put:
      tags: [Cart]
      summary: Modifie la quantité d'un item
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: productId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, min: 1, max: 99 }
      responses:
        "200": { description: Modifié }
        "404": { description: "Produit pas dans le panier" }
    delete:
      tags: [Cart]
      summary: Retire un produit du panier
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: productId, required: true, schema: { type: integer } }
      responses:
        "200": { description: Retiré }

  /cart/checkout:
    post:
      tags: [Cart]
      summary: Transforme le panier en 1 commande par vendeur (avec promo optionnelle)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_method]
              properties:
                delivery_method: { type: string, enum: [pickup, delivery, shipping] }
                delivery_address: { type: string, nullable: true }
                promo_code: { type: string, nullable: true }
      responses:
        "201":
          description: Commandes créées
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orders_count: { type: integer }
                  orders: { type: array, items: { type: object } }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Boutique masquée ou en vacances" }

  # ============================================================
  # WISHLIST
  # ============================================================
  /wishlist:
    get:
      tags: [Wishlist]
      summary: Liste mes favoris (enrichis)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /wishlist/count:
    get:
      tags: [Wishlist]
      summary: Nombre de favoris
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compteur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }

  /wishlist/product-ids:
    get:
      tags: [Wishlist]
      summary: IDs des produits favoris (pour afficher les cœurs)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tableau d'IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  product_ids: { type: array, items: { type: integer } }

  /wishlist/check/{productId}:
    get:
      tags: [Wishlist]
      summary: Vérifie si un produit est en favori
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: productId, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Statut
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  in_wishlist: { type: boolean }

  /wishlist/{productId}:
    post:
      tags: [Wishlist]
      summary: Toggle un favori
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: productId, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Toggle effectué
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  in_wishlist: { type: boolean }

  # ============================================================
  # PROMO
  # ============================================================
  /promo/validate:
    post:
      tags: [Promo]
      summary: Valide un code promo (checks complets, sans l'utiliser)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code: { type: string, minLength: 3 }
                subtotal: { type: number, minimum: 0 }
                product_ids:
                  type: array
                  items: { type: integer }
                  description: "Optionnel : vérifier que le code seller s'applique"
      responses:
        "200":
          description: Code valide
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  valid: { type: boolean }
                  code: { type: string }
                  type: { type: string, enum: [percent, fixed] }
                  value: { type: number }
                  discount_preview: { type: number }
                  new_subtotal: { type: number }
        "400": { description: Code invalide/expiré/épuisé }
        "404": { description: Code inexistant }

  /admin/promo:
    get:
      tags: [Promo]
      summary: (Admin) Liste tous les codes (plateforme + sellers)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: active_only, schema: { type: boolean, default: false } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Promo]
      summary: (Admin) Crée un code plateforme (+ notif users si notify_users=true)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value]
              properties:
                code: { type: string, pattern: "^[A-Z0-9_-]+$" }
                description: { type: string, nullable: true }
                type: { type: string, enum: [percent, fixed] }
                value: { type: number }
                min_amount: { type: number, nullable: true }
                max_uses: { type: integer, nullable: true }
                max_uses_per_user: { type: integer, nullable: true }
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true }
                is_active: { type: boolean, default: true }
                notify_users: { type: boolean, default: false }
      responses:
        "201": { description: Code créé }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/promo/{id}:
    put:
      tags: [Promo]
      summary: (Admin) Modifie un code
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Modifié }
    delete:
      tags: [Promo]
      summary: (Admin) Supprime un code
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }

  /promo/my:
    get:
      tags: [Promo]
      summary: Liste mes codes promo (pro)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: active_only, schema: { type: boolean, default: false } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Promo]
      summary: Crée un code promo pour mes boutiques (pro)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value]
              properties:
                code: { type: string, pattern: "^[A-Z0-9_-]+$" }
                description: { type: string, nullable: true }
                type: { type: string, enum: [percent, fixed] }
                value: { type: number }
                min_amount: { type: number, nullable: true }
                max_uses: { type: integer, nullable: true }
                max_uses_per_user: { type: integer, nullable: true }
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        "201": { description: Code créé }
        "409": { $ref: "#/components/responses/Conflict" }

  /promo/my/{id}:
    put:
      tags: [Promo]
      summary: Modifie un de mes codes (pro)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Modifié }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Promo]
      summary: Supprime un de mes codes (pro)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================
  # CATEGORIES
  # ============================================================
  /categories:
    get:
      tags: [Categories]
      summary: Liste toutes les catégories (public)
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 100 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /categories/slug/{slug}:
    get:
      tags: [Categories]
      summary: Récupère une catégorie par slug
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200": { description: Catégorie }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Récupère une catégorie par ID (+ compteur de shops)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Catégorie }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/categories:
    post:
      tags: [Categories]
      summary: (Admin) Crée une catégorie
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
