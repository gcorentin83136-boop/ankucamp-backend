                icon: { type: string, nullable: true }
                image_url: { type: string, format: uri, nullable: true }
      responses:
        "201": { description: Catégorie créée }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/categories/{id}:
    put:
      tags: [Categories]
      summary: (Admin) Modifie une catégorie
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Modifiée }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Categories]
      summary: (Admin) Supprime une catégorie (impossible si shops l'utilisent)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimée }
        "400": { description: Catégorie utilisée par une boutique }

  # ============================================================
  # KYC
  # ============================================================
  /kyc/request:
    post:
      tags: [KYC]
      summary: Soumettre une demande KYC (pro only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, siret, documents]
              properties:
                type: { type: string, enum: [agriculteur, artisan, createur, autre] }
                siret: { type: string, pattern: "^\\d{14}$" }
                documents:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: uri }
      responses:
        "201": { description: Demande créée }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Demande déjà en cours" }

  /kyc/me:
    get:
      tags: [KYC]
      summary: Ma dernière demande KYC
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Demande ou null
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  request: { type: object, nullable: true }
    delete:
      tags: [KYC]
      summary: Annule ma demande KYC pending
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Annulée }
        "404": { description: "Aucune demande en cours" }

  /admin/kyc/requests:
    get:
      tags: [KYC]
      summary: (Admin) Liste les demandes KYC
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, pending, approved, rejected], default: pending } }
        - { in: query, name: type, schema: { type: string, enum: [all, agriculteur, artisan, createur, autre], default: all } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /admin/kyc/stats:
    get:
      tags: [KYC]
      summary: (Admin) Stats KYC (pending / approved / rejected)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Stats }

  /admin/kyc/requests/{id}:
    get:
      tags: [KYC]
      summary: (Admin) Détail d'une demande
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kyc/requests/{id}/approve:
    put:
      tags: [KYC]
      summary: (Admin) Approuve + attribue badges (verified + type)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Approuvé }
        "409": { description: "Déjà traité" }

  /admin/kyc/requests/{id}/reject:
    put:
      tags: [KYC]
      summary: (Admin) Rejette avec motif
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "200": { description: Rejeté }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ============================================================
  # MODERATION (signalements)
  # ============================================================
  /reports:
    post:
      tags: [Moderation]
      summary: Signaler un contenu (post, review, user...)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type: { type: string, enum: [post, comment, review, product, shop, user, message] }
                target_id: { type: integer }
                reason: { type: string, enum: [spam, harassment, hate_speech, violence, copyright, fake, other] }
                description: { type: string, maxLength: 1000, nullable: true }
      responses:
        "201": { description: Signalement créé }
        "400": { description: Auto-signalement interdit }
        "404": { description: Cible inexistante }
        "409": { description: Doublon }

  /admin/moderation/reports:
    get:
      tags: [Moderation]
      summary: (Admin) Liste les signalements
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, pending, resolved, dismissed], default: pending } }
        - { in: query, name: target_type, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /admin/moderation/reports/stats:
    get:
      tags: [Moderation]
      summary: (Admin) Stats signalements
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Stats }

  /admin/moderation/reports/{id}:
    get:
      tags: [Moderation]
      summary: (Admin) Détail d'un signalement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/moderation/reports/{id}/resolve:
    put:
      tags: [Moderation]
      summary: (Admin) Résout + supprime le contenu (par défaut)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_note: { type: string, nullable: true }
                delete_content: { type: boolean, default: true }
      responses:
        "200": { description: Résolu }
        "409": { description: "Déjà traité" }

  /admin/moderation/reports/{id}/dismiss:
    put:
      tags: [Moderation]
      summary: (Admin) Rejette le signalement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_note]
              properties:
                admin_note: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "200": { description: Rejeté }
        "400": { $ref: "#/components/responses/BadRequest" }

