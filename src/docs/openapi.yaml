openapi: 3.0.3

info:
  title: ANKUCAMP API
  description: |
    API du réseau social local & marketplace ANKUCAMP.

    **Authentification** : Bearer JWT (header `Authorization: Bearer <token>`)
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Développement

tags:
  - name: Health
    description: Vérification de l'état de l'API
  - name: Auth
    description: Authentification email/password + OAuth Google
  - name: 2FA
    description: Double authentification TOTP
  - name: Users
    description: Profils utilisateurs
  - name: Shops
    description: Boutiques
  - name: Products
    description: Produits
  - name: Orders
    description: Commandes
  - name: Payments
    description: Paiements Stripe
  - name: Refunds
    description: Remboursements
  - name: Reviews
    description: Avis
  - name: Posts
    description: Réseau social — posts
  - name: Friends
    description: Amis
  - name: Follows
    description: Abonnements boutiques
  - name: Conversations
    description: Messagerie
  - name: Notifications
    description: Notifications
  - name: Uploads
    description: Upload de fichiers Cloudinary
  - name: Settings
    description: Paramètres utilisateur et boutique
  - name: Search
    description: Recherche globale et par proximité
  - name: Geo
    description: Géolocalisation
  - name: Events
    description: Événements locaux
  - name: Articles
    description: Blog / articles
  - name: Cart
    description: Panier
  - name: Wishlist
    description: Favoris produits
  - name: Promo
    description: Codes promo
  - name: Categories
    description: Catégories
  - name: KYC
    description: Vérification pro (SIRET)
  - name: Badges
    description: Badges de confiance
  - name: Moderation
    description: Signalements et modération
  - name: Dashboard
    description: Dashboards (buyer / seller / admin)
  - name: Audit
    description: Audit log admin
  - name: Backup
    description: Backup DB admin
  - name: Admin
    description: Endpoints admin transverses

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflit (déjà existant)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erreur"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

paths:
  # ============================================================
  # HEALTH
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Vérifie que l'API répond
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  # ============================================================
  # AUTH
  # ============================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription avec email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, role]
              properties:
                first_name: { type: string, maxLength: 100, example: "Alice" }
                last_name: { type: string, maxLength: 100, example: "Dupont" }
                email: { type: string, format: email, example: "alice@test.com" }
                password: { type: string, minLength: 8, example: "motdepasse123" }
                birth_year: { type: integer, minimum: 1900, example: 1995 }
                address: { type: string, maxLength: 255 }
                city: { type: string, maxLength: 100 }
                postal_code: { type: string, maxLength: 20 }
                country: { type: string, maxLength: 100, default: "France" }
                role: { type: string, enum: [particulier, professionnel] }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  user: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion (email + password) — renvoie token OU requires_2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: |
            - Sans 2FA : `{ success, user, token }`
            - Avec 2FA activée : `{ success, requires_2fa: true, temp_token }`
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean }
                      user: { type: object }
                      token: { type: string }
                  - type: object
                    properties:
                      success: { type: boolean }
                      requires_2fa: { type: boolean, example: true }
                      temp_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (révoque la session courante)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Déconnecté }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/activate:
    post:
      tags: [Auth]
      summary: Active un compte via token d'activation (reçu par email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Compte activé }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Demande un lien de réinitialisation par email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Email envoyé (toujours 200 même si email inexistant)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Réinitialise le mot de passe via token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Mot de passe réinitialisé }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/google:
    get:
      tags: [Auth]
      summary: Redirige vers Google OAuth (pas d'auth)
      responses:
        "302": { description: Redirect vers Google }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth — redirige vers le front avec token
      responses:
        "302":
          description: Redirect vers le front (avec `?token=JWT` en URL)

  # ============================================================
  # 2FA
  # ============================================================
  /auth/2fa/status:
    get:
      tags: [2FA]
      summary: Statut 2FA de l'utilisateur connecté
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Statut
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  enabled: { type: boolean }
                  setup_in_progress: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/2fa/setup:
    post:
      tags: [2FA]
      summary: Génère un secret TOTP + QR code (étape 1)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Secret + QR code + URI otpauth
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  secret: { type: string }
                  qr_code: { type: string, description: "Data URL PNG base64" }
                  otpauth: { type: string }

  /auth/2fa/verify:
    post:
      tags: [2FA]
      summary: Valide le 1er code TOTP → active la 2FA + retourne 10 backup codes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: 2FA activée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  enabled: { type: boolean }
                  backup_codes:
                    type: array
                    items: { type: string }

  /auth/2fa/disable:
    post:
      tags: [2FA]
      summary: Désactive la 2FA (password + code)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: "Code TOTP ou backup code" }
      responses:
        "200": { description: 2FA désactivée }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/2fa/validate:
    post:
      tags: [2FA]
      summary: Login étape 2 (publique) — valide code + temp_token → JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, code]
              properties:
                temp_token: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  user: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ============================================================
  # USERS
  # ============================================================
  /users/me:
    get:
      tags: [Users]
      summary: Mon profil complet
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Mon profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  user: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Users]
      summary: Modifie mon profil
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
                email: { type: string, format: email }
                birth_year: { type: integer }
                address: { type: string }
                city: { type: string }
                postal_code: { type: string }
                country: { type: string }
                bio: { type: string, maxLength: 500 }
                website: { type: string, format: uri }
                location: { type: string }
                cover_url: { type: string, format: uri }
      responses:
        "200": { description: Profil mis à jour }

  /users/me/privacy:
    put:
      tags: [Users]
      summary: Modifie la confidentialité (is_private)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_private]
              properties:
                is_private: { type: boolean }
      responses:
        "200": { description: Confidentialité mise à jour }

  /users:
    get:
      tags: [Users]
      summary: Liste paginée des users
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  users:
                    type: array
                    items: { type: object }

  /users/u/{username}:
    get:
      tags: [Users]
      summary: Profil public par username
      parameters:
        - { in: path, name: username, required: true, schema: { type: string } }
      responses:
        "200": { description: Profil }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}:
    get:
      tags: [Users]
      summary: Profil par ID
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Profil }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/stats:
    get:
      tags: [Users]
      summary: Stats d'un user (posts, avis, etc.)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Stats }

  /users/{id}/friends:
    get:
      tags: [Users]
      summary: Amis d'un user (auth optionnelle si profil privé)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste d'amis }

  # ============================================================
  # BADGES
  # ============================================================
  /users/{id}/badges:
    get:
      tags: [Badges]
      summary: Badges actifs d'un user
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  badges:
                    type: array
                    items: { type: string }
    post:
      tags: [Badges]
      summary: (Admin) Attribue un badge à un user
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge]
              properties:
                badge:
                  type: string
                  enum: [verified, agriculteur, artisan, createur, bio, producteur_local]
      responses:
        "201": { description: Badge attribué }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/badges/{badge}:
    delete:
      tags: [Badges]
      summary: (Admin) Révoque un badge
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: badge, required: true, schema: { type: string } }
      responses:
        "200": { description: Badge révoqué }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================
  # CONVERSATIONS + MESSAGES
  # ============================================================
  /conversations:
    get:
      tags: [Conversations]
      summary: Liste mes conversations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  conversations:
                    type: array
                    items: { type: object }
    post:
      tags: [Conversations]
      summary: Crée une conversation (direct ou groupe)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [direct, group] }
                name: { type: string, description: "Requis si type=group" }
                participant_ids:
                  type: array
                  items: { type: integer }
      responses:
        "201": { description: Conversation créée }
        "400": { $ref: "#/components/responses/BadRequest" }

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Détail d'une conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Détail }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Conversations]
      summary: Modifie une conversation (nom/avatar de groupe — admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatar_url: { type: string, format: uri }
      responses:
        "200": { description: Modifiée }
    delete:
      tags: [Conversations]
      summary: Supprime une conversation (admin du groupe)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimée }

  /conversations/{id}/leave:
    post:
      tags: [Conversations]
      summary: Quitte la conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Quitté }

  /conversations/{id}/participants:
    post:
      tags: [Conversations]
      summary: Ajoute un participant (admin du groupe)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
      responses:
        "201": { description: Participant ajouté }

  /conversations/{id}/participants/{userId}:
    delete:
      tags: [Conversations]
      summary: Retire un participant (admin du groupe)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: userId, required: true, schema: { type: integer } }
      responses:
        "200": { description: Participant retiré }

  /conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: Liste les messages (paginés)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }
    post:
      tags: [Conversations]
      summary: Envoie un message
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                type: { type: string, enum: [text, image, file], default: text }
                media_url: { type: string, format: uri }
                reply_to_message_id: { type: integer, nullable: true }
      responses:
        "201": { description: Envoyé }

  /conversations/{id}/read:
    post:
      tags: [Conversations]
      summary: Marque les messages comme lus jusqu'à un message_id
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last_read_message_id]
              properties:
                last_read_message_id: { type: integer }
      responses:
        "200": { description: Lu }

  /messages/{messageId}:
    put:
      tags: [Conversations]
      summary: Édite un message (auteur uniquement)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: messageId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200": { description: Édité }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Conversations]
      summary: Supprime un message (soft delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: messageId, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimé }

  /messages/{messageId}/reactions:
    post:
      tags: [Conversations]
      summary: Toggle une réaction emoji
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: messageId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, maxLength: 10 }
      responses:
        "200": { description: Réaction toggled }

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  /notifications/me:
    get:
      tags: [Notifications]
      summary: Liste mes notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Liste }

  /notifications/me/unread-count:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues (badge)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compteur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Marque TOUTES mes notifications comme lues
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Marquées lues }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Marque UNE notification comme lue
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Marquée lue }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Supprime une notification
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Supprimée }

  /notifications/push/subscribe:
    post:
      tags: [Notifications]
      summary: Enregistre un token FCM (push notifications)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android, web] }
                device_info: { type: string }
      responses:
        "201": { description: Token enregistré }

  /notifications/push/unsubscribe:
    delete:
      tags: [Notifications]
      summary: Supprime un token FCM
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
